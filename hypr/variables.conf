###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

$terminal = kitty
$fileManager = nautilus
$menu = wofi --show drun
$menu_logout = pkill wlogout || wlogout -b 2 -c 10 -r 10
$taskmanager = flatpak kill net.nokyan.Resources || net.nokyan.Resources
$Screenshot = grim -g "$(slurp)" - | tee ~/Pictures/region_$(date +%Y-%m-%d_%H-%M-%S).png | wl-copy
$Screenshot-satty = grim -g "$(slurp)" - | satty -f - \
  --output-filename ~/Pictures/region_$(date +%Y-%m-%d_%H-%M-%S).png \
  --copy-command wl-copy \
  --actions-on-enter save-to-clipboard,exit
$mainMod = SUPER # Sets "Windows" key as main modifier
